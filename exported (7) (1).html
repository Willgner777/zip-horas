<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lara Docinho de Mel 🍯💖</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Fredoka', sans-serif;
      background: linear-gradient(135deg, #fff0f5 0%, #ffe4e1 50%, #ffd1dc 100%);
      min-height: 100vh;
      overflow-x: hidden;
    }

    .font-handwriting {
      font-family: 'Dancing Script', cursive;
    }

    /* Floating Hearts Animation */
    .heart-particle {
      position: absolute;
      pointer-events: none;
      animation: floatUp 4s linear infinite;
    }

    @keyframes floatUp {
      0% {
        transform: translateY(0) scale(0.8) rotate(0deg);
        opacity: 1;
      }
      100% {
        transform: translateY(-100vh) scale(1.3) rotate(360deg);
        opacity: 0;
      }
    }

    /* Shimmer Effect for Gold/Honey accents */
    .honey-shimmer {
      background: linear-gradient(90deg, #f59e0b, #fbbf24, #f59e0b);
      background-size: 200% auto;
      color: transparent;
      -webkit-background-clip: text;
      animation: shimmer 3s linear infinite;
    }

    @keyframes shimmer {
      to {
        background-position: 200% center;
      }
    }

    /* Soft Glow Animation */
    .glow-card {
      box-shadow: 0 10px 30px -5px rgba(244, 114, 182, 0.3),
                  0 0 20px 2px rgba(251, 191, 36, 0.2);
    }

    /* Button Pulse */
    .btn-pulse {
      animation: pulseGlow 2s infinite;
    }

    @keyframes pulseGlow {
      0%, 100% {
        transform: scale(1);
        box-shadow: 0 0 15px rgba(244, 114, 182, 0.5);
      }
      50% {
        transform: scale(1.05);
        box-shadow: 0 0 25px rgba(244, 114, 182, 0.8);
      }
    }
  </style>
</head>
<body class="flex items-center justify-center p-4 relative">

  <!-- Floating Hearts Background Container -->
  <div id="hearts-container" class="fixed inset-0 pointer-events-none z-0"></div>

  <!-- Main Card -->
  <main class="relative z-10 w-full max-w-lg bg-white/80 backdrop-blur-md rounded-3xl p-8 border-4 border-pink-200 glow-card text-center my-8 transition-all duration-300 hover:scale-[1.01]">
    
    <!-- Top Decorative Icons -->
    <div class="flex justify-center items-center gap-2 mb-2 text-3xl">
      <span class="animate-bounce" style="animation-delay: 0.1s;">🍯</span>
      <span class="animate-bounce" style="animation-delay: 0.2s;">💖</span>
      <span class="animate-bounce" style="animation-delay: 0.3s;">🐝</span>
      <span class="animate-bounce" style="animation-delay: 0.4s;">💖</span>
      <span class="animate-bounce" style="animation-delay: 0.5s;">🍯</span>
    </div>

    <!-- Subtitle Banner -->
    <div class="inline-block bg-pink-100 text-pink-600 font-bold px-4 py-1 rounded-full text-sm uppercase tracking-wider mb-4 border border-pink-300">
      Especial & Doce
    </div>

    <!-- Main Title -->
    <h1 class="text-4xl sm:text-5xl font-extrabold text-pink-600 mb-1 leading-tight tracking-wide">
      LARA
    </h1>
    <h2 class="text-3xl sm:text-4xl font-handwriting honey-shimmer font-bold mb-6">
      Docinho de Mel
    </h2>

    <!-- Decorative Line -->
    <div class="flex items-center justify-center gap-2 mb-6">
      <div class="h-0.5 w-12 bg-pink-300 rounded-full"></div>
      <span class="text-pink-400 text-xl">♥</span>
      <div class="h-0.5 w-12 bg-pink-300 rounded-full"></div>
    </div>

    <!-- Card Description / Message -->
    <p class="text-gray-700 text-lg leading-relaxed mb-8 font-medium">
      Um cantinho cheio de afeto, doçura e todo o brilho do mundo para adoçar o seu dia! ✨🌸
    </p>

    <!-- Interactive Counter / Love Note Section -->
    <div class="bg-amber-50/80 border-2 border-amber-200 rounded-2xl p-5 mb-8 shadow-inner text-left relative overflow-hidden">
      <div class="absolute -right-3 -bottom-3 text-6xl opacity-10 pointer-events-none">🍯</div>
      <h3 class="text-amber-800 font-bold text-sm uppercase tracking-wide mb-2 flex items-center gap-2">
        <span>💛</span> Potes de Mel acumulados:
      </h3>
      <div class="flex items-baseline gap-3">
        <span id="honey-counter" class="text-4xl font-black text-amber-500">100</span>
        <span class="text-amber-700 font-semibold text-sm">gotinhas de carinho</span>
      </div>
    </div>

    <!-- Action Buttons -->
    <div class="flex flex-col sm:flex-row gap-4 justify-center">
      <button id="btn-heart" onclick="sendHearts(event)" class="btn-pulse bg-gradient-to-r from-pink-400 to-rose-400 hover:from-pink-500 hover:to-rose-500 text-white font-bold py-3.5 px-6 rounded-2xl shadow-lg transition duration-200 active:scale-95 flex items-center justify-center gap-2 text-lg">
        <span>Enviar Corações</span>
        <span>💖</span>
      </button>

      <button id="btn-sweet" onclick="addHoney()" class="bg-gradient-to-r from-amber-400 to-yellow-500 hover:from-amber-500 hover:to-yellow-600 text-white font-bold py-3.5 px-6 rounded-2xl shadow-lg transition duration-200 active:scale-95 flex items-center justify-center gap-2 text-lg">
        <span>Adoçar +1</span>
        <span>🍯</span>
      </button>
    </div>

    <!-- Footer Note -->
    <footer class="mt-8 text-xs text-pink-400 font-medium">
      Feito com carinho para a Lara 💕
    </footer>
  </main>

  <script>
    // Create Continuous Floating Hearts in Background
    function createBackgroundHeart() {
      const container = document.getElementById('hearts-container');
      const heart = document.createElement('div');
      
      const hearts = ['💖', '💕', '💗', '💓', '🍯', '🌸', '✨'];
      const randomHeart = hearts[Math.floor(Math.random() * hearts.length)];
      
      heart.classList.add('heart-particle');
      heart.innerText = randomHeart;
      heart.style.left = Math.random() * 100 + 'vw';
      heart.style.bottom = '-50px';
      heart.style.fontSize = (Math.random() * 20 + 16) + 'px';
      heart.style.animationDuration = (Math.random() * 3 + 3) + 's';
      
      container.appendChild(heart);

      setTimeout(() => {
        heart.remove();
      }, 6000);
    }

    // Interval for background hearts
    setInterval(createBackgroundHeart, 400);

    // Interactive Button: Explosion of Hearts
    function sendHearts(e) {
      const amount = 15;
      for (let i = 0; i < amount; i++) {
        setTimeout(() => {
          const heart = document.createElement('div');
          heart.innerText = ['💖', '💕', '💗', '💝'][Math.floor(Math.random() * 4)];
          heart.style.position = 'fixed';
          heart.style.left = (e.clientX + (Math.random() * 100 - 50)) + 'px';
          heart.style.top = (e.clientY + (Math.random() * 100 - 50)) + 'px';
          heart.style.fontSize = (Math.random() * 25 + 20) + 'px';
          heart.style.pointerEvents = 'none';
          heart.style.transition = 'all 1s ease-out';
          heart.style.zIndex = '9999';

          document.body.appendChild(heart);

          requestAnimationFrame(() => {
            heart.style.transform = `translate(${(Math.random() - 0.5) * 200}px, -${Math.random() * 200 + 100}px) scale(1.5)`;
            heart.style.opacity = '0';
          });

          setTimeout(() => heart.remove(), 1000);
        }, i * 40);
      }
    }

    // Interactive Button: Honey Counter Increment
    let count = 100;
    function addHoney() {
      count += 10;
      const counterEl = document.getElementById('honey-counter');
      counterEl.innerText = count;
      counterEl.classList.add('scale-125', 'text-amber-600');
      setTimeout(() => {
        counterEl.classList.remove('scale-125', 'text-amber-600');
      }, 200);
    }
  </script>
</body>
</html>
