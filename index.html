<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Baixar PDFs - Horas Extras</title>
<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@2.38.3/lib/msal-browser.min.js"></script>
<script>window.msal||document.write('<script src="https://alcdn.msauth.net/browser/2.38.3/js/msal-browser.min.js"><\/script>')</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  body{font-family:Segoe UI,Arial,sans-serif;background:#f3f4f6;margin:0;display:flex;align-items:center;justify-content:center;min-height:100vh}
  .card{background:#fff;border-radius:12px;padding:28px 32px;max-width:460px;width:90%;box-shadow:0 4px 18px rgba(0,0,0,.12)}
  h1{font-size:18px;margin:0 0 14px}
  #status{font-size:14px;color:#374151;white-space:pre-line}
  .bar{height:8px;background:#e5e7eb;border-radius:4px;margin-top:14px;overflow:hidden}
  .bar>div{height:100%;width:0;background:#2563eb;transition:width .2s}
  .erro{color:#b91c1c}
</style>
</head>
<body>
<div class="card">
  <h1>Gerando ZIP dos PDFs</h1>
  <div id="status">Iniciando...</div>
  <div class="bar"><div id="prog"></div></div>
</div>

<script>
/* ====== CONFIGURAÇÃO (preencha client e tenant) ====== */
const CONFIG = {
  clientId: "5af6c376-aeda-4851-abd5-aacaae260439",
  tenantId: "669ab6c9-4a10-4796-a3dc-90f5e7d6ff40",
  site: "https://willtech7.sharepoint.com",
  listId: "15362ede-c1d8-47df-8aa5-d65fbc303d5f",
  maxItens: 20
};
/* ===================================================== */

/* ===== Diagnóstico: mostra erros na tela ===== */
function mostrarErro(msg){
  const el = document.getElementById("status");
  el.textContent = "Erro: " + msg;
  el.className = "erro";
}
window.addEventListener("error", e => mostrarErro(e.message));
window.addEventListener("unhandledrejection", e => mostrarErro((e.reason && e.reason.message) || String(e.reason)));
if (typeof msal === "undefined" || typeof JSZip === "undefined"){
  mostrarErro("as bibliotecas MSAL/JSZip não carregaram (rede ou bloqueador). Teste em janela anônima ou outra rede.");
  throw new Error("Bibliotecas não carregaram");
}

const scopes = [CONFIG.site + "/AllSites.Read"];
const msalApp = new msal.PublicClientApplication({
  auth: {
    clientId: CONFIG.clientId,
    authority: "https://login.microsoftonline.com/" + CONFIG.tenantId,
    redirectUri: window.location.origin + window.location.pathname
  },
  cache: { cacheLocation: "localStorage" }
});

const elStatus = document.getElementById("status");
const elProg = document.getElementById("prog");
function setStatus(t, erro){ elStatus.textContent = t; elStatus.className = erro ? "erro" : ""; }
function setProg(p){ elProg.style.width = Math.round(p * 100) + "%"; }

async function getToken(){
  const r = await msalApp.handleRedirectPromise();
  const account = (r && r.account) || msalApp.getAllAccounts()[0];
  if (!account){ await msalApp.loginRedirect({ scopes }); return null; }
  try {
    const t = await msalApp.acquireTokenSilent({ scopes, account });
    return t.accessToken;
  } catch (e) {
    await msalApp.acquireTokenRedirect({ scopes, account });
    return null;
  }
}

async function sp(url, token, blob){
  const resp = await fetch(url, { headers: {
    Authorization: "Bearer " + token,
    Accept: "application/json;odata=nometadata"
  }});
  if (!resp.ok) throw new Error("SharePoint " + resp.status + " em " + url);
  return blob ? resp.blob() : resp.json();
}

async function main(){
  /* Guarda os IDs antes do login (o redirect do Microsoft remove a query string) */
  const qsIds = new URLSearchParams(location.search).get("ids");
  if (qsIds) sessionStorage.setItem("idsPendentes", qsIds);
  const rawIds = qsIds || sessionStorage.getItem("idsPendentes") || "";

  const ids = [...new Set(
    rawIds
      .split(",").map(s => s.trim()).filter(s => /^\d+$/.test(s))
  )].slice(0, CONFIG.maxItens);

  if (!ids.length){ setStatus("Nenhum ID informado na URL (?ids=1,2,3).", true); return; }

  const token = await getToken();
  if (!token) return;

  const zip = new JSZip();
  let total = 0, feitos = 0;

  /* 1) Lista os PDFs de cada item */
  setStatus("Buscando anexos de " + ids.length + " item(ns)...");
  const arquivos = [];
  for (const id of ids){
    const url = CONFIG.site + "/_api/web/lists(guid'" + CONFIG.listId + "')/items(" + id +
                ")/AttachmentFiles?$select=FileName,ServerRelativeUrl";
    const data = await sp(url, token, false);
    (data.value || [])
      .filter(a => a.FileName.toLowerCase().endsWith(".pdf"))
      .forEach(a => arquivos.push({ id, nome: a.FileName, caminho: a.ServerRelativeUrl }));
  }
  total = arquivos.length;
  if (!total){ setStatus("Nenhum PDF encontrado nos itens selecionados.", true); return; }

  /* 2) Baixa cada PDF (3 por vez) e adiciona ao ZIP */
  const fila = [...arquivos];
  async function worker(){
    while (fila.length){
      const f = fila.shift();
      const url = CONFIG.site + "/_api/web/GetFileByServerRelativeUrl('" +
                  encodeURI(f.caminho.replace(/'/g, "''")) + "')/$value";
      const blob = await sp(url, token, true);
      zip.file(f.id + "_" + f.nome, blob);
      feitos++;
      setStatus("Baixando PDFs: " + feitos + " de " + total);
      setProg(feitos / total);
    }
  }
  await Promise.all([worker(), worker(), worker()]);

  /* 3) Gera e baixa o ZIP */
  setStatus("Compactando...");
  const out = await zip.generateAsync({ type: "blob" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(out);
  a.download = "HorasExtras_" + new Date().toISOString().slice(0, 10) + ".zip";
  document.body.appendChild(a);
  a.click();
  a.remove();
  sessionStorage.removeItem("idsPendentes");
  setStatus("Pronto! " + total + " PDF(s) no ZIP.\nPode fechar esta aba.");
}

main().catch(e => { console.error(e); setStatus("Erro: " + e.message, true); });
</script>
</body>
</html>
